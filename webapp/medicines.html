
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Management | MediStock</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .page-container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 20px;
        }

        .page-heading {
            color: #164e63;
            margin-bottom: 25px;
        }

        .medicine-form, .table-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .medicine-form h2, .table-section h2 {
            color: #164e63;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .form-grid label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-grid input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
        }

        .action-btn {
            border: none;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            margin-top: 20px;
        }

        .add-btn { background: #087e8b; }
        .edit-btn { background: #2563eb; margin: 0 4px; }
        .delete-btn { background: #dc2626; margin: 0 4px; }

        .search-box {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .table-wrapper { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #164e63;
            color: white;
        }

        .message {
            margin: 15px 0;
            font-weight: bold;
        }

        @media (max-width: 750px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<header class="navbar">
    <div class="logo">MediStock</div>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="medicines.html">Medicines</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main class="page-container">

    <h1 class="page-heading">Medicine Management</h1>

    <section class="medicine-form">
        <h2>Add New Medicine</h2>

        <form id="medicineForm">
            <div class="form-grid">

                <div>
                    <label for="medicineName">Medicine Name</label>
                    <input type="text" id="medicineName" required>
                </div>

                <div>
                    <label for="manufacturer">Manufacturer</label>
                    <input type="text" id="manufacturer" required>
                </div>

                <div>
                    <label for="category">Category</label>
                    <input type="text" id="category" required>
                </div>

                <div>
                    <label for="price">Price (₹)</label>
                    <input type="number" id="price" min="0" step="0.01" required>
                </div>

                <div>
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" min="0" required>
                </div>

                <div>
                    <label for="expiryDate">Expiry Date</label>
                    <input type="date" id="expiryDate" required>
                </div>

            </div>

            <button type="submit" class="action-btn add-btn">
                Add Medicine
            </button>
        </form>

        <p id="message" class="message"></p>
    </section>

    <section class="table-section">

        <h2>Medicine Inventory</h2>

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search by medicine name or manufacturer..."
        >

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Medicine</th>
                        <th>Manufacturer</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Expiry Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="medicineTable">
                    <tr>
                        <td colspan="8">Loading medicines...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </section>

</main>

<script>
    const api = "medicines";
    let medicines = [];

    const message = document.getElementById("message");
    const table = document.getElementById("medicineTable");

    async function loadMedicines() {
        try {
            const response = await fetch(api);

            if (response.status === 401) {
                window.location.href = "login.html";
                return;
            }

            if (!response.ok) {
                throw new Error("Could not load medicines.");
            }

            medicines = await response.json();
            displayMedicines(medicines);

        } catch (error) {
            table.innerHTML =
                '<tr><td colspan="8">Unable to load medicines. Check server.</td></tr>';
        }
    }

    function displayMedicines(list) {
        table.innerHTML = "";

        if (list.length === 0) {
            table.innerHTML =
                '<tr><td colspan="8">No medicines found.</td></tr>';
            return;
        }

        list.forEach(m => {
            const tr = document.createElement("tr");

            [
                m.medicineId,
                m.medicineName,
                m.manufacturer,
                m.category,
                "₹" + Number(m.price).toFixed(2),
                m.quantity,
                m.expiryDate
            ].forEach(value => {
                const td = document.createElement("td");
                td.textContent = value ?? "";
                tr.appendChild(td);
            });

            const actionCell = document.createElement("td");

            const editButton = document.createElement("button");
            editButton.textContent = "Update";
            editButton.className = "action-btn edit-btn";
            editButton.addEventListener("click", () => updateMedicine(m));

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "action-btn delete-btn";
            deleteButton.addEventListener("click", () => deleteMedicine(m.medicineId));

            actionCell.append(editButton, deleteButton);
            tr.appendChild(actionCell);
            table.appendChild(tr);
        });
    }

    document.getElementById("medicineForm")
        .addEventListener("submit", async function(event) {

        event.preventDefault();

        const data = new URLSearchParams({
            medicineName: document.getElementById("medicineName").value.trim(),
            manufacturer: document.getElementById("manufacturer").value.trim(),
            category: document.getElementById("category").value.trim(),
            price: document.getElementById("price").value,
            quantity: document.getElementById("quantity").value,
            expiryDate: document.getElementById("expiryDate").value
        });

        try {
            const response = await fetch(api, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: data
            });

            const result = await response.json();
            message.textContent = result.message;

            if (result.success) {
                this.reset();
                loadMedicines();
            }
        } catch (error) {
            message.textContent = "Unable to add medicine.";
        }
    });

    async function updateMedicine(medicine) {
        const price = prompt("Enter new price:", medicine.price);
        if (price === null) return;

        const quantity = prompt("Enter new quantity:", medicine.quantity);
        if (quantity === null) return;

        if (price.trim() === "" || quantity.trim() === "" ||
            !Number.isFinite(Number(price)) ||
            !Number.isInteger(Number(quantity)) ||
            Number(price) < 0 || Number(quantity) < 0) {
            alert("Enter a valid price and whole-number quantity.");
            return;
        }

        const data = new URLSearchParams({
            medicineId: medicine.medicineId,
            price: price,
            quantity: quantity
        });

        try {
            const response = await fetch(api, {
                method: "PUT",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: data
            });

            const result = await response.json();
            message.textContent = result.message;
            if (result.success) loadMedicines();

        } catch (error) {
            message.textContent = "Unable to update medicine.";
        }
    }

    async function deleteMedicine(id) {
        if (!confirm("Are you sure you want to delete this medicine?")) return;

        try {
            const response = await fetch(api + "?medicineId=" + encodeURIComponent(id), {
                method: "DELETE"
            });

            const result = await response.json();
            message.textContent = result.message;
            if (result.success) loadMedicines();

        } catch (error) {
            message.textContent = "Unable to delete medicine.";
        }
    }

    document.getElementById("searchInput")
        .addEventListener("input", function() {

        const term = this.value.toLowerCase();

        displayMedicines(medicines.filter(m =>
            m.medicineName.toLowerCase().includes(term) ||
            m.manufacturer.toLowerCase().includes(term)
        ));
    });

    loadMedicines();
</script>

</body>
</html>
